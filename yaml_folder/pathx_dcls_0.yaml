# COMPRESSION
latent_dim: ~
comp_act: ~ # 'relu', 'gelu', 'linear'
# NORMALIZATION
postnorm: False
# DECODER
decoder_bias: True
# REGULARIZATION
do_rate: 0
reg_factor: 0
# Gradient clipping
grad_clip_norm: 5
# Logging
