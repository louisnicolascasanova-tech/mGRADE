seed: 0
mem_frac: 0.5
n_epochs: 100
batch_size: 32
lr: 0.004
scheduler: True
alpha_cosine: 0
warmup_frac: 0.3
weight_decay: 0.01
n_layers: 6
hidden_dim: 12
# ENCODER
encoder: False
# SKIP
layer_skip: True
element_skip: False
# RECURRENT
enable_rec: True
rec_act: 'sigmoid' # 'relu', 'tanh', 'gelu', 'linear'
# CONVOLUTION
enable_conv: False
conv: ~ # 'dcls', 'conv'
kernel_size: ~
init_std: ~ # DCLS
delay_type: ~ # DCLS: 'synaptic', 'axonal'
delay_kernel: ~ # DCLS: 'gaussian'
wavenet_dilation: ~ # ~, False, True ; ~ or False --> LERF, True --> EERF
dilation_schedule: ~ # EERF: 'clip', 'wrap', ~
dilation_offset: ~ # EERF
constant_dilation: ~ # LERF
kernel_n_elems: ~ # DCLS
heterogeneous_weights: ~ # DCLS
heterogeneous_positions: ~ # DCLS
heterogeneous_std: ~ # DCLS
train_weights: ~ # DCLS
train_positions: ~ # DCLS
train_std: ~ # DCLS
# CHANNEL MIXING
enable_cm: False
channel_mixing: 'mlp'  # 'glu', 'mlp', ~
cm_act: 'relu' # 'relu', 'gelu', 'linear'
glu_type: ~ # 'full', 'candidate', 'gate'
# COMPRESSION
latent_dim: ~
comp_act: ~ # 'relu', 'gelu', 'linear'
# NORMALIZATION
postnorm: True
# REGULARIZATION
do_rate: 0
reg_factor: 0
# Wandb gradients
wandb_gradients: True


