# name: pathx_c7_L6_lin_h_h64_256dcls64_5e-4lr0.05_wd0.05_bs8_z1cst2_h1Zero_EWgn5_LS_seed0_max_bi_noLN
seed: 0
mem_frac: 0.95
n_epochs: 20
batch_size: 8
# Stratified sampling: ensures each batch has exactly 50% of each class
stratified_sampling: False  # Set to False for original random sampling
lr: 0.0005
scheduler: True
alpha_cosine: 0
warmup_frac: 0.1
weight_decay: 0.05
# Optimizer settings - Configuration loaded from optimizer_config.yaml
n_layers: 6
hidden_dim: 64
