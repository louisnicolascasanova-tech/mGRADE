enable_conv: True
conv: 'dcls' # 'dcls', 'conv', ~
kernel_size: 256
conv_ln: False
# LERF and EERF
wavenet_dilation: ~ # False means LERF, True means EERF
# LERF
constant_dilation: ~ 
# EERF
dilation_schedule: ~ # 'clip', 'wrap', ~
dilation_offset: ~
dilation_boundary: ~
