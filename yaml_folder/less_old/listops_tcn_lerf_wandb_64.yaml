name: sweep
metric:
  name: val/acc_best
  goal: maximize
method: grid
parameters:
  dataset:
    value: listops
  hidden_dim:
    value: 128
  n_layers:
    value: 6
  seed:
    values: [0,1,2]
  n_epochs:
    value: 100
  mem_frac:
    value: 0.9
  batch_size:
    value: 64
  lr:
    values: [0.003, 0.004, 0.005]
  lr_factors:
    value: [1, 1, 1, 1, 1, 1]
  scheduler:
    value: true
  alpha_cosine:
    value: 0
  warmup_frac:
    value: 0.1
  weight_decay:
    value: 0.1
  bias_optim:
    value: adam
  scale_optim:
    value: adam
  # Encoder / Decoder
  encoder:
    value: true
  encoder_bias:
    value: true
  encoder_scale:
    value: 1
  decoder_bias:
    value: true
  # Recurrent
  enable_rec:
    value: false
  rec_act:
    value: ~
  dense_z_weight_init_scale:
    value: ~
  dense_z_bias_init:
    value: ~
  dense_h_bias_init:
    value: ~
  dense_h_weight_init_scale:
    value: ~
  weight_init_scale:
    value: ~
  # Convolutional
  enable_conv:
    value: true
  kernel_size:
    value: 64
  conv:
    value: conv
  constant_dilation:
    value: 1
  wavenet_dilation:
    value: False
  dilation_schedule:
    value: null
  dilation_offset:
    value: null
  dilation_boundary:
    value: null
  # DCLS
  kernel_n_elems:
    value: ~
  heterogeneous_positions:
    value: ~
  heterogeneous_weights:
    value: ~
  train_weights:
    value: ~
  delay_type:
    value: ~
  delay_kernel:
    value: ~
  init_std:
    value: ~
  heterogeneous_std:
    value: ~
  train_positions:
    value: ~
  train_std:
    value: ~
  # Channel mixing
  enable_cm:
    value: true
  channel_mixing:
    value: mlp
  cm_act:
    value: relu
  glu_type:
    value: null
  # Compression
  latent_dim:
    value: null
  comp_act:
    value: null
  # Regularization
  do_rate:
    value: 0
  reg_factor:
    value: 0
  grad_clip_norm:
    value: 10
  # wandb
  log_model_behavior:
    value: true
  wandb_matrices:
    value: false
  wandb_gradients:
    value: false
  wandb_states:
    value: true
  # Layer-specific optimizer settings
  dcls_positions_optim: 
    value: adam_big
  dcls_weights_optim: 
    value: adamw
  mlp_kernel_optim: 
    value: adamw
  gru_kernel_optim: 
    value: adamw
  postnorm_scale_optim: 
    value: adam
  mlp_scale_optim: 
    value: adam
  mlp_bias_optim: 
    value: adam
  gru_bias_optim: 
    value: adam
  postnorm_bias_optim: 
    value: adam
  # Layernorm
  encoder_ln:
    value: false
  conv_ln:
    value: false
  rec_ln:
    value: false
  cm_ln:
    value: false
  postnorm:
    value: true
  # Skip connections
  layer_skip:
    value: false
  element_skip:
    value: true

